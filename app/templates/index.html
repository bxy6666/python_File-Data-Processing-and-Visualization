<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>交互式数据分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">成员D负责部分</p>
        <h1>交互式数据分析系统</h1>
      </div>
      <span class="status-pill">Flask + Plotly</span>
    </header>

    <main class="workspace">
      <section class="flow-panel" aria-labelledby="flow-title">
        <div class="section-heading">
          <p class="eyebrow">Workflow</p>
          <h2 id="flow-title">上传 -> 清洗 -> 分析 -> 可视化 -> 导出</h2>
        </div>

        <div class="steps">
          <section class="step" aria-labelledby="upload-title">
            <div class="step-index">01</div>
            <h3 id="upload-title">上传数据</h3>
            <p>接口由成员A接入，当前保留调用入口。</p>
            <form id="upload-form">
              <input id="file-input" name="file" type="file" accept=".csv,.xls,.xlsx">
              <button type="submit">调用上传接口</button>
            </form>
          </section>

          <section class="step" aria-labelledby="clean-title">
            <div class="step-index">02</div>
            <h3 id="clean-title">数据清洗</h3>
            <p>接口由成员B接入，当前只发送统一规则结构。</p>
            <div class="option-row">
              <label><input id="drop-missing" type="checkbox" checked> 删除缺失值</label>
              <label><input id="drop-duplicates" type="checkbox" checked> 删除重复行</label>
              <label><input id="handle-outliers" type="checkbox"> 检测异常值</label>
            </div>
            <button id="clean-button" type="button">调用清洗接口</button>
          </section>

          <section class="step" aria-labelledby="analyze-title">
            <div class="step-index">03</div>
            <h3 id="analyze-title">K-Means 分析</h3>
            <p>接口由成员C接入，当前保留参数提交格式。</p>
            <div class="field-grid">
              <label>
                数值列
                <input id="analyze-columns" type="text" value="sales,profit">
              </label>
              <label>
                k 值
                <input id="cluster-count" type="number" min="2" max="6" value="3">
              </label>
            </div>
            <button id="analyze-button" type="button">调用分析接口</button>
          </section>

          <section class="step" aria-labelledby="export-title">
            <div class="step-index">04</div>
            <h3 id="export-title">结果导出</h3>
            <p>接口由成员A接入，当前保留下载入口。</p>
            <div class="button-row">
              <button data-export-type="cleaned" type="button">导出清洗数据</button>
              <button data-export-type="result" type="button">导出分析结果</button>
            </div>
          </section>
        </div>
      </section>

      <section class="visual-panel" aria-labelledby="visual-title">
        <div class="section-heading">
          <p class="eyebrow">Visualization</p>
          <h2 id="visual-title">Plotly 图表预留区</h2>
        </div>
        <form id="visual-form" class="visual-form">
          <label>
            图表类型
            <select id="chart-type">
              <option value="bar">柱状图</option>
              <option value="line">折线图</option>
              <option value="scatter" selected>散点图</option>
              <option value="box">箱线图</option>
            </select>
          </label>
          <label>
            x 字段
            <input id="x-field" type="text" value="sales">
          </label>
          <label>
            y 字段
            <input id="y-field" type="text" value="profit">
          </label>
          <label>
            color 字段
            <input id="color-field" type="text" value="cluster">
          </label>
          <button type="submit">生成图表</button>
        </form>
        <div id="chart" class="chart-placeholder"></div>
      </section>

      <section class="output-panel" aria-labelledby="output-title">
        <div class="section-heading">
          <p class="eyebrow">Response</p>
          <h2 id="output-title">接口响应</h2>
        </div>
        <div id="message" class="message">等待操作。</div>
        <pre id="response-output">{}</pre>
      </section>
    </main>
  </body>
</html>
